name: JAV Auto Scraper

on:
  schedule:
    - cron: '0 * * * *' # ၁ နာရီလျှင် တစ်ကြိမ် အလိုအလျောက် Run မည်
  workflow_dispatch:     # Manual ခလုတ်နှိပ်၍ Run နိုင်မည်

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Scraper
        run: python scraper.py
        
